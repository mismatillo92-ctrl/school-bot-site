<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maktab Reyting Bot</title>
  <style>
    /* Umumiy sozlamalar */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Orqa fon ustiga qorong‘i qatlam */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 15, 40, 0.7); /* dark blue */
      backdrop-filter: blur(5px);
      z-index: -1;
    }

    /* Profil dumaloq */
    .profile {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: url('https://cdn-icons-png.flaticon.com/512/149/149071.png') no-repeat center/cover;
      border: 2px solid #4fc3f7;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(79,195,247,0.7);
    }

    /* Menu tugmalari */
    .menu {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 100px;
    }

    .menu button {
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(135deg, #1976d2, #0d47a1);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: transform 0.2s, background 0.3s;
    }

    .menu button:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #2196f3, #0d47a1);
    }

    /* Shop icon */
    .shop {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0d47a1, #42a5f5);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(66,165,245,0.8);
    }

    .shop img {
      width: 30px;
      height: 30px;
      filter: invert(1);
    }

  </style>
</head>
<body>
  <!-- Profil -->
  <div class="profile"></div>

  <!-- Menu -->
  <div class="menu">
    <button>Reyting</button>
    <button>Vazifalar</button>
    <button>Testlar</button>
  </div>

  <!-- Shop -->
  <div class="shop">
    <img src="https://cdn-icons-png.flaticon.com/512/1170/1170678.png" alt="Shop">
  </div>
</body>
</html>
